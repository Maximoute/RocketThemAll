services:
  postgres:
    image: rta-postgres:16.14-security
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: rta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collector}
      POSTGRES_DB: ${POSTGRES_DB:-collector}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:d386393960d3126c034d6597b752bc33a02a2c237069788aabcf6d035c166b27
    container_name: rta-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:d386393960d3126c034d6597b752bc33a02a2c237069788aabcf6d035c166b27
    depends_on:
      - minio
    entrypoint:
      - /usr/bin/sh
      - -ec
      - |
        sleep 3
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/card-images
        mc anonymous set download local/card-images
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}

  mysql:
    image: mysql:8.0
    container_name: rta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: rta-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: "define('WP_HOME','http://localhost/blog'); define('WP_SITEURL','http://localhost/blog');"
      WORDPRESS_DEBUG: '0'
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      - mysql

  api:
    image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
    container_name: rta-api
    working_dir: /workspace
    command: sh -c "npm install && npm run prisma:generate && npm run -w @rta/api dev"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://collector:collector@postgres:5432/collector}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-card-images}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/card-images}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - ./:/workspace
    depends_on:
      - postgres
      - minio

  bot:
    image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
    container_name: rta-bot
    working_dir: /workspace
    command: sh -c "npm install && npm run -w @rta/bot dev"
    env_file:
      - path: .env
        required: false
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_SPAWN_CHANNEL_ID: ${DISCORD_SPAWN_CHANNEL_ID:-}
      ADMIN_ROLE_ID: ${ADMIN_ROLE_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://collector:collector@postgres:5432/collector}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-card-images}
    volumes:
      - ./:/workspace
    depends_on:
      - api

  web:
    image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
    container_name: rta-web
    working_dir: /workspace
    command: sh -c "npm install && npm run -w @rta/web prisma:generate && npm run -w @rta/web dev"
    env_file:
      - path: .env
        required: false
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://collector:collector@postgres:5432/collector}
      PRISMA_QUERY_ENGINE_LIBRARY: /workspace/packages/database/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      INTERNAL_API_URL: http://api:4000
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  nginx:
    image: rta-nginx:stable-security
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: rta-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - wordpress

volumes:
  pgdata:
  minio-data:
  mysql-data:
  wordpress-data:
