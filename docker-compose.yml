name: rta-sandbox

x-app-security: &app-security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]

x-app-environment: &app-environment
  NODE_ENV: production
  RTA_ENVIRONMENT: sandbox
  DATABASE_URL: postgresql://${POSTGRES_USER:-rta_sandbox}:${POSTGRES_PASSWORD:-rta_sandbox_local_only}@postgres:5432/${POSTGRES_DB:-rta_sandbox}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rta-sandbox-app}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-rta-sandbox-app-local-only}
  S3_BUCKET: card-images
  S3_PUBLIC_URL: http://localhost:${RTA_SANDBOX_PORT:-3100}/media
  PUBLIC_BASE_URL: http://localhost:${RTA_SANDBOX_PORT:-3100}
  NEXTAUTH_URL: http://localhost:${RTA_SANDBOX_PORT:-3100}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-rta-sandbox-nextauth-local-only-change-me}
  RTA_PAYMENTS_ENABLED: "false"
  DISCORD_MONETIZATION_ENABLED: "false"

services:
  postgres:
    image: rta-sandbox-postgres:local
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rta_sandbox}
      POSTGRES_USER: ${POSTGRES_USER:-rta_sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rta_sandbox_local_only}
    ports:
      - 127.0.0.1:${RTA_SANDBOX_POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=4m,uid=999,gid=70,mode=3775
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:617ff93bf711edab967765dcb8002bea6dc31e8584627cbd11008198466e0ae8
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rta-sandbox-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rta-sandbox-root-local-only}
    ports:
      - 127.0.0.1:${RTA_SANDBOX_MINIO_PORT:-59000}:9000
      - 127.0.0.1:${RTA_SANDBOX_MINIO_CONSOLE_PORT:-59001}:9001
    volumes:
      - minio-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /home/nonroot:size=8m,uid=65532,gid=65532,mode=700
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$${status}" == *' 200 '* ]]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:617ff93bf711edab967765dcb8002bea6dc31e8584627cbd11008198466e0ae8
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/usr/bin/sh, -ec]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/card-images
        mc anonymous set download local/card-images
        cat > /tmp/policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::card-images"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::card-images/*"]}]}
        JSON
        mc admin policy create local rta-sandbox-card-images /tmp/policy.json || true
        mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" || true
        mc admin policy attach local rta-sandbox-card-images --user "$${S3_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rta-sandbox-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rta-sandbox-root-local-only}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rta-sandbox-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rta-sandbox-app-local-only}
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /home/nonroot:size=8m,uid=65532,gid=65532,mode=700
    networks: [backend]

  migrate:
    <<: *app-security
    image: rta-sandbox-migrate:local
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: *app-environment
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app-security
    image: rta-sandbox-migrate:local
    restart: "no"
    command: [npm, run, prisma:seed]
    environment:
      <<: *app-environment
      RTA_VAULT_ROOT: /Vault-RTA
      RTA_REPLACE_CARDS: "true"
    volumes:
      - ../Vault-RTA:/Vault-RTA:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully

  media-sync:
    <<: *app-security
    profiles: [tools]
    image: rta-sandbox-migrate:local
    restart: "no"
    command: [node, scripts/sync-vault-media.mjs]
    environment:
      <<: *app-environment
      RTA_VAULT_ROOT: /Vault-RTA
    volumes:
      - ../Vault-RTA:/Vault-RTA:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  api:
    <<: *app-security
    image: rta-sandbox-api:local
    build:
      context: .
      target: api
    environment:
      <<: *app-environment
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      FRONTEND_ORIGIN: http://localhost:${RTA_SANDBOX_PORT:-3100}
      BUILD_SHA: sandbox-local
    ports:
      - 127.0.0.1:${RTA_SANDBOX_API_PORT:-4100}:4000
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *app-security
    profiles: [full]
    image: rta-sandbox-worker:local
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_LEASE_MS: "60000"
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      seed:
        condition: service_completed_successfully

  bot:
    <<: *app-security
    profiles: [discord]
    image: rta-sandbox-bot:local
    build:
      context: .
      target: bot
    env_file:
      - path: .env.sandbox
        required: false
    environment:
      <<: *app-environment
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    <<: *app-security
    image: rta-sandbox-web:local
    build:
      context: .
      target: web
      args:
        RTA_PUBLIC_BASE_URL: http://localhost:${RTA_SANDBOX_PORT:-3100}
    env_file:
      - path: .env.sandbox
        required: false
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:4000
      API_URL: http://api:4000
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: rta-sandbox-nginx:local
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    ports:
      - 127.0.0.1:${RTA_SANDBOX_PORT:-3100}:8080
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m
    depends_on:
      web:
        condition: service_started
    networks: [backend]

volumes:
  postgres-data:
  minio-data:

networks:
  backend:
