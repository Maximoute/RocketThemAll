name: rta

x-app-security: &app-security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_BUCKET: card-images
  S3_PUBLIC_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}/media
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/card-images
        mc anonymous set download local/card-images
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    networks:
      - backend

  migrate:
    <<: *app-security
    build:
      context: .
      target: migrate
    restart: "no"
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-security
    build:
      context: .
      target: api
    environment:
      <<: *app-environment
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      FRONTEND_ORIGIN: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      BUILD_SHA: ${BUILD_SHA:-local}
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *app-security
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_LEASE_MS: "60000"
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *app-security
    build:
      context: .
      target: bot
    environment:
      <<: *app-environment
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_ADMIN_ROLE_ID: ${DISCORD_ADMIN_ROLE_ID:-${ADMIN_ROLE_ID:-}}
      DISCORD_MONETIZATION_ENABLED: ${DISCORD_MONETIZATION_ENABLED:-false}
      DISCORD_SKU_VIP_MONTHLY: ${DISCORD_SKU_VIP_MONTHLY:-}
      DISCORD_SKU_FOUNDER_MONTHLY: ${DISCORD_SKU_FOUNDER_MONTHLY:-}
      DISCORD_SKU_CREDITS_1000: ${DISCORD_SKU_CREDITS_1000:-}
      DISCORD_SKU_CREDITS_12000: ${DISCORD_SKU_CREDITS_12000:-}
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app-security
    build:
      context: .
      target: web
      args:
        RTA_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      API_INTERNAL_URL: http://api:4000
      API_URL: http://api:4000
      RTA_PAYMENTS_ENABLED: ${RTA_PAYMENTS_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      STRIPE_PRICE_VIP_MONTHLY: ${STRIPE_PRICE_VIP_MONTHLY:-}
      STRIPE_PRICE_FOUNDER_MONTHLY: ${STRIPE_PRICE_FOUNDER_MONTHLY:-}
      STRIPE_PRICE_CREDITS_1000: ${STRIPE_PRICE_CREDITS_1000:-}
      STRIPE_PRICE_CREDITS_12000: ${STRIPE_PRICE_CREDITS_12000:-}
      DISCORD_MONETIZATION_ENABLED: ${DISCORD_MONETIZATION_ENABLED:-false}
      DISCORD_SKU_VIP_MONTHLY: ${DISCORD_SKU_VIP_MONTHLY:-}
      DISCORD_SKU_FOUNDER_MONTHLY: ${DISCORD_SKU_FOUNDER_MONTHLY:-}
      DISCORD_SKU_CREDITS_1000: ${DISCORD_SKU_CREDITS_1000:-}
      DISCORD_SKU_CREDITS_12000: ${DISCORD_SKU_CREDITS_12000:-}
      LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
      LEGAL_PUBLISHER_STATUS: ${LEGAL_PUBLISHER_STATUS:-}
      LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
      LEGAL_PUBLISHER_EMAIL: ${LEGAL_PUBLISHER_EMAIL:-}
      LEGAL_PUBLISHER_PHONE: ${LEGAL_PUBLISHER_PHONE:-}
      LEGAL_ENTERPRISE_NUMBER: ${LEGAL_ENTERPRISE_NUMBER:-}
      LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER:-}
      LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR:-}
      LEGAL_DATA_CONTROLLER_NAME: ${LEGAL_DATA_CONTROLLER_NAME:-}
      LEGAL_PRIVACY_EMAIL: ${LEGAL_PRIVACY_EMAIL:-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
      LEGAL_HOST_WEBSITE: ${LEGAL_HOST_WEBSITE:-}
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m
    depends_on:
      web:
        condition: service_started
    networks:
      - backend

volumes:
  postgres-data:
  minio-data:

networks:
  backend:
    internal: false
