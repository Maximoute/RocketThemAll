name: Deploy production

on:
  push:
    branches:
      - RTAV2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rta-production
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://rocketthemall.com

jobs:
  quality-gate:
    name: Require successful CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          run_id=""
          for _ in {1..36}; do
            run_id="$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=push \
              -f per_page=100 \
              --jq '.workflow_runs | map(select(.name == "CI")) | .[0].id // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No CI run was found for commit $GITHUB_SHA." >&2
            exit 1
          fi
          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

  publish-app-images:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality-gate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, bot, worker, web, migrate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compute immutable image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: RTA_PUBLIC_BASE_URL=${{ env.PUBLIC_BASE_URL }}
          cache-from: type=gha,scope=production-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.target }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-postgres-image:
    name: Publish PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: quality-gate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compute immutable image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-postgres" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postgres/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=production-postgres
          cache-to: type=gha,mode=max,scope=production-postgres
      - name: Attest image provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [publish-app-images, publish-postgres-image]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing VPS_HOST environment secret}"
          : "${VPS_USER:?Missing VPS_USER environment secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY environment secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS environment secret}"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${VPS_SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
      - name: Prepare signed SSH connection
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$RUNNER_TEMP/rta-deploy-key"
          known_hosts_file="$RUNNER_TEMP/rta-known-hosts"
          install -m 0600 /dev/null "$key_file"
          install -m 0600 /dev/null "$known_hosts_file"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          {
            echo "key=$key_file"
            echo "known_hosts=$known_hosts_file"
            echo "port=${VPS_SSH_PORT:-22}"
          } >> "$GITHUB_OUTPUT"
      - name: Package release configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "$RUNNER_TEMP/rta-release.tgz" \
            docker-compose.production.yml \
            docker-compose.registry.yml \
            docker/caddy/Caddyfile \
            docker/nginx/production.conf \
            scripts/deploy-vps.sh
      - name: Upload and deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_archive="/srv/rocketthemall/releases/${GITHUB_SHA}.tgz"
          ssh_opts=(
            -i "${{ steps.ssh.outputs.key }}"
            -p "${{ steps.ssh.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${{ steps.ssh.outputs.known_hosts }}"
            -o ConnectTimeout=15
          )
          scp_opts=(
            -i "${{ steps.ssh.outputs.key }}"
            -P "${{ steps.ssh.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${{ steps.ssh.outputs.known_hosts }}"
            -o ConnectTimeout=15
          )
          remote="${VPS_USER}@${VPS_HOST}"

          cleanup_login() {
            ssh "${ssh_opts[@]}" "$remote" 'docker logout ghcr.io >/dev/null 2>&1 || true' || true
          }
          trap cleanup_login EXIT

          printf '%s' "$GHCR_TOKEN" | \
            ssh "${ssh_opts[@]}" "$remote" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scp "${scp_opts[@]}" "$RUNNER_TEMP/rta-release.tgz" "$remote:$release_archive"
          ssh "${ssh_opts[@]}" "$remote" bash -s -- "$GITHUB_SHA" "$image_prefix" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          image_prefix="$2"
          deploy_root=/srv/rocketthemall
          release_dir="$deploy_root/releases/$sha"
          archive="$deploy_root/releases/$sha.tgz"

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 0750 "$release_dir"
          tar -xzf "$archive" -C "$release_dir" --no-same-owner --no-same-permissions
          rm -f "$archive"
          chmod 0750 "$release_dir/scripts/deploy-vps.sh"
          exec "$release_dir/scripts/deploy-vps.sh" "$sha" "$image_prefix"
          REMOTE
      - name: Verify public HTTPS endpoint
        shell: bash
        run: >-
          curl --fail --show-error --silent
          --retry 18 --retry-all-errors --retry-delay 5
          --max-time 15
          https://rocketthemall.com/api/health/ready
      - name: Remove ephemeral SSH files
        if: always()
        shell: bash
        run: rm -f "${{ steps.ssh.outputs.key }}" "${{ steps.ssh.outputs.known_hosts }}"
