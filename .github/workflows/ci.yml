name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - RTAV2
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_USER: rta
          POSTGRES_PASSWORD: rta-ci-password
          POSTGRES_DB: rta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rta -d rta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://rta:rta-ci-password@127.0.0.1:5432/rta_ci
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      RTA_PUBLIC_BASE_URL: http://localhost:3000
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run validate:context
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Validate production Compose
        env:
          POSTGRES_DB: rta
          POSTGRES_USER: rta
          POSTGRES_PASSWORD: ci-compose-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-secret
          S3_ACCESS_KEY: ci-rta-app
          S3_SECRET_KEY: ci-rta-app-secret
          DISCORD_TOKEN: ci-token
          DISCORD_CLIENT_ID: ci-client
          DISCORD_CLIENT_SECRET: ci-secret
          NEXTAUTH_SECRET: ci-nextauth-secret
          NEXTAUTH_URL: https://rta.example.invalid
          PUBLIC_BASE_URL: https://rta.example.invalid
          RTA_IMAGE_PREFIX: ghcr.io/maximoute/rocketthemall
          RTA_IMAGE_TAG: 0000000000000000000000000000000000000000
        run: |
          docker compose -f docker-compose.production.yml config --quiet
          docker compose \
            -f docker-compose.production.yml \
            -f docker-compose.registry.yml \
            config --quiet
          bash -n scripts/deploy-vps.sh
      - name: Validate private development Compose
        env:
          POSTGRES_DB: rta_dev
          POSTGRES_USER: rta_dev
          POSTGRES_PASSWORD: ci-dev-compose-password
          MINIO_ROOT_USER: ci-dev-minio
          MINIO_ROOT_PASSWORD: ci-dev-minio-secret
          S3_ACCESS_KEY: ci-dev-rta-app
          S3_SECRET_KEY: ci-dev-rta-app-secret
          DISCORD_CLIENT_ID_DEV: ci-dev-client
          DISCORD_CLIENT_SECRET_DEV: ci-dev-secret
          RTA_DEVELOPMENT_ADMIN_DISCORD_ID: "123456789012345678"
          NEXTAUTH_SECRET: ci-dev-nextauth-secret
          RTA_IMAGE_PREFIX: ghcr.io/maximoute/rocketthemall
          RTA_IMAGE_TAG: 0000000000000000000000000000000000000000
        run: |
          docker compose -f docker-compose.development.yml config --quiet
          bash -n scripts/bootstrap-vps-development.sh
          bash -n scripts/deploy-vps-development.sh
      - name: Validate edge proxy configurations
        run: |
          cert_dir="$RUNNER_TEMP/caddy-certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=dev.rocketthemall.com' \
            -keyout "$cert_dir/dev.rocketthemall.com.key" \
            -out "$cert_dir/dev.rocketthemall.com.crt" \
            >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$cert_dir:/etc/caddy/certs:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -v "$PWD/docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c \
            nginx -t
          docker run --rm \
            -v "$PWD/docker/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c \
            nginx -t

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [api, bot, worker, web, migrate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: rta/${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reject vulnerable runtime images
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --quiet --scanners vuln
          --exit-code 1 --severity HIGH,CRITICAL
          rta/${{ matrix.target }}:${{ github.sha }}

  database-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/postgres/Dockerfile
          push: false
          load: true
          tags: rta/postgres:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reject vulnerable database image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --quiet --scanners vuln
          --exit-code 1 --severity HIGH,CRITICAL
          rta/postgres:${{ github.sha }}
      - name: Build and reject vulnerable Caddy image
        run: |
          docker build \
            --file docker/caddy/Dockerfile \
            --tag rta/caddy:${{ github.sha }} \
            .
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --quiet --scanners vuln \
          --exit-code 1 --severity HIGH,CRITICAL \
          rta/caddy:${{ github.sha }}
      - name: Build and reject vulnerable Nginx image
        run: |
          docker build \
            --file docker/nginx/Dockerfile \
            --tag rta/nginx:${{ github.sha }} \
            .
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --quiet --scanners vuln \
            --exit-code 1 --severity HIGH,CRITICAL \
            rta/nginx:${{ github.sha }}
      - name: Reject vulnerable proxy and object-storage base images
        run: |
          for image in \
            "cgr.dev/chainguard/minio:latest@sha256:617ff93bf711edab967765dcb8002bea6dc31e8584627cbd11008198466e0ae8"
          do
            docker pull "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --quiet --scanners vuln \
              --exit-code 1 --severity HIGH,CRITICAL "$image"
          done
