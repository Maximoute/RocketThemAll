limit_req_zone $binary_remote_addr zone=rta_api:10m rate=20r/s;
log_format rta_privacy '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
access_log /dev/stdout rta_privacy;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;
map $http_x_forwarded_proto $rta_forwarded_proto {
    default $scheme;
    http http;
    https https;
}
map $request_method $rta_mutation_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $rta_mutation_key zone=rta_mutations:10m rate=10r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rta_api_upstream {
    zone rta_api_upstream 64k;
    server api:4000 resolve;
}

upstream rta_web_upstream {
    zone rta_web_upstream 64k;
    server web:3000 resolve;
}

upstream rta_media_upstream {
    zone rta_media_upstream 64k;
    server minio:9000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 1M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.discordapp.com https://media.discordapp.net; connect-src 'self'; media-src 'self'; worker-src 'self' blob:" always;

    # NextAuth is served by Next.js; keep it ahead of the generic API proxy.
    location ^~ /api/auth/ {
        limit_req zone=rta_mutations burst=30 nodelay;
        proxy_pass http://rta_web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rta_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Stripe signature verification needs the untouched request body handled by Next.js.
    location = /api/payments/stripe/webhook {
        limit_req zone=rta_api burst=40 nodelay;
        proxy_pass http://rta_web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rta_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=rta_api burst=40 nodelay;
        proxy_pass http://rta_api_upstream/;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rta_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api {
        return 308 /api/;
    }

    location /media/ {
        proxy_pass http://rta_media_upstream/card-images/;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
        expires 1h;
    }

    location / {
        limit_req zone=rta_mutations burst=30 nodelay;
        proxy_pass http://rta_web_upstream/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rta_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
