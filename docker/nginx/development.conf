limit_req_zone $binary_remote_addr zone=rta_dev_api:10m rate=20r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rta_dev_api_upstream {
    zone rta_dev_api_upstream 64k;
    server api:4000 resolve;
}

upstream rta_dev_web_upstream {
    zone rta_dev_web_upstream 64k;
    server web:3000 resolve;
}

upstream rta_dev_media_upstream {
    zone rta_dev_media_upstream 64k;
    server minio:9000 resolve;
}

server {
    listen 8080;
    server_name dev.rocketthemall.com;
    server_tokens off;
    client_max_body_size 1M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, max-age=0" always;

    location = /_development/authorize {
        internal;
        proxy_pass http://rta_dev_web_upstream/api/development/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /api/auth/ {
        proxy_pass http://rta_dev_web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=rta_dev_api burst=40 nodelay;
        proxy_pass http://rta_dev_api_upstream/;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        auth_request /_development/authorize;
        proxy_pass http://rta_dev_media_upstream/card-images/;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
    }

    location / {
        proxy_pass http://rta_dev_web_upstream/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
